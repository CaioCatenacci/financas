name = "financas"
main = "worker/index.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

# Workers Logs nativo: guarda o console.error do Worker para ler no painel depois,
# sem precisar de `wrangler tail` aberto na hora (E6).
[observability]
enabled = true

# G5: lembrete do fechamento pelo Telegram — dias 5 e 15, 12h UTC (9h de Brasília).
# O Worker trata no `scheduled` de worker/index.js.
[triggers]
crons = ["0 12 5,15 * *"]
